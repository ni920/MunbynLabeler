name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Universal app
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select modern Xcode when available
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import plistlib, re, subprocess
          candidates = []
          for app in Path("/Applications").glob("Xcode*.app"):
              info = app / "Contents/Info.plist"
              if not info.exists():
                  continue
              version = plistlib.loads(info.read_bytes()).get("CFBundleShortVersionString", "")
              parts = tuple(int(value) for value in re.findall(r"\d+", version))
              if parts and parts[0] >= 26:
                  candidates.append((parts, app))
          if candidates:
              _, app = max(candidates)
              subprocess.run(["sudo", "xcode-select", "--switch", str(app / "Contents/Developer")], check=True)
          subprocess.run(["xcodebuild", "-version"], check=True)
          PYCODE

      - name: Run protocol self-test
        run: |
          swift build -c release --product LabelCoreSelfTest
          SELF_TEST_BINARY="$(swift build -c release --show-bin-path)/LabelCoreSelfTest"
          codesign --force --sign - "$SELF_TEST_BINARY"
          "$SELF_TEST_BINARY"

      - name: Build Universal 2 app
        run: ./script/build_and_run.sh build

      - name: Test and package browser extension
        run: ./script/package_browser_extension.sh

      - name: Verify bundle
        run: |
          APP_BINARY="dist/Label Helper.app/Contents/MacOS/MunbynLabeler"
          lipo "$APP_BINARY" -verify_arch arm64
          lipo "$APP_BINARY" -verify_arch x86_64
          test -d 'dist/Label Helper.app/Contents/Frameworks/Sparkle.framework'
          otool -L "$APP_BINARY" | grep -q Sparkle.framework
          codesign --verify --deep --strict 'dist/Label Helper.app'
          test -f 'dist/Label Helper.app/Contents/Resources/AppIcon.icns'

      - name: Package release
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            'dist/Label Helper.app' \
            dist/LabelHelper-universal.zip
          cd dist
          shasum -a 256 LabelHelper-universal.zip \
            > LabelHelper-universal.zip.sha256
          shasum -a 256 LabelHelper-Browser-Extension.zip \
            > LabelHelper-Browser-Extension.zip.sha256

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          UPDATES_DIR="$RUNNER_TEMP/munbyn-updates"
          mkdir -p "$UPDATES_DIR"
          cp dist/LabelHelper-universal.zip "$UPDATES_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
              --maximum-deltas 0 \
              -o "$UPDATES_DIR/appcast.xml" \
              "$UPDATES_DIR"
          cp "$UPDATES_DIR/appcast.xml" dist/appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/sign_update \
              --ed-key-file - \
              --verify \
              dist/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/LabelHelper-universal.zip \
            dist/LabelHelper-universal.zip.sha256 \
            dist/LabelHelper-Browser-Extension.zip \
            dist/LabelHelper-Browser-Extension.zip.sha256 \
            dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Label Helper $GITHUB_REF_NAME"
